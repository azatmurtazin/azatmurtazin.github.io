---
layout: default
---
<h1>{{ page.title }}</h1>
<p style="color: gray;">Дата: {{ page.date | date: "%Y-%m-%d" }}</p>

<!-- Блок вывода тегов текущего поста -->
{% if page.tags.size > 0 %}
  <div class="post-tags" style="margin-bottom: 20px;">
    Теги:
    {% for tag in page.tags %}
      <a href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">#{{ tag }}</a>{% unless forloop.last %}, {% endunless %}
    {% endfor %}
  </div>
{% endif %}

<div class="post-content">
  {{ content }}
</div>
